name: Reproduce build memory exhaustion

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      next-version:
        description: Next.js version or dist-tag
        required: true
        default: canary
        type: string
      components-per-route:
        description: Synthetic client modules generated for each route
        required: true
        default: "120"
        type: string
      react-compiler:
        description: Enable the native Turbopack React Compiler
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      bundler:
        description: Production bundler
        required: true
        default: turbopack
        type: choice
        options:
          - turbopack
          - webpack

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile --minimum-release-age=0
      - name: Assert cgroup memory exhaustion reproduces
        env:
          NEXT_VERSION: ${{ inputs.next-version || '16.3.2' }}
          REPRO_COMPONENTS_PER_ROUTE: ${{ inputs.components-per-route || '120' }}
          REPRO_REACT_COMPILER: ${{ inputs.react-compiler || 'true' }}
          REPRO_BUNDLER: ${{ inputs.bundler || 'turbopack' }}
        run: |
          set +e
          bun run reproduce -- "$NEXT_VERSION"
          status=$?
          set -e
          if [[ "$REPRO_BUNDLER" == "turbopack" ]]; then
            test "$status" -eq 124 -o "$status" -eq 137
            awk '$1 == "max" && $2 > 0 { found = 1 } END { exit !found }' \
              "results/$NEXT_VERSION-$REPRO_BUNDLER/memory.events"
          else
            exit "$status"
          fi
      - name: Upload memory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: next-build-memory-${{ inputs.next-version || '16.3.2' }}-${{ inputs.bundler || 'turbopack' }}
          path: results/
